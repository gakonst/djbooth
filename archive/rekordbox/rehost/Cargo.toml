[package]
name = "rekordbox-analyzer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hound = "3"
libc = "0.2"
plist = "1"
djbooth-analyzer = { path = "../../../rust/crates/djbooth-analyzer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
