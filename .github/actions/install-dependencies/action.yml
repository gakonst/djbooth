name: Install dependencies
description: Prepare the music-ts workspace and all dependencies

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24.15"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
