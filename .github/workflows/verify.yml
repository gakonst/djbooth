name: Verify

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 24
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Set up Rust formatting
        run: rustup component add --toolchain nightly rustfmt

      - name: Set up iOS Rust target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios-sim

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build iOS app
        if: runner.os == 'macOS'
        run: xcodebuild -project apps/apple/DJBooth.xcodeproj -scheme DJBooth-iOS -destination 'generic/platform=iOS Simulator' -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

      - name: Validate workspace
        run: pnpm validate
