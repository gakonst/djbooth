name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  global-install:
    name: Package and global CLI
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install packed CLI globally
        run: >-
          pnpm install --global
          --allow-build=better-sqlite3-multiple-ciphers
          "$RUNNER_TEMP"/gakonst-rekordbox-*.tgz
      - run: rekordbox status --format json
      - run: rekordbox-ts status --format json
      - name: Create a plain SQLite smoke fixture
        run: >-
          node --input-type=module -e
          "import Database from 'better-sqlite3-multiple-ciphers';
          const db = new Database(process.env.RUNNER_TEMP + '/master.db');
          db.exec('CREATE TABLE djmdContent (ID TEXT PRIMARY KEY); CREATE TABLE djmdPlaylist (ID TEXT PRIMARY KEY)');
          db.close()"
      - name: Query the fixture through the global CLI
        run: rekordbox db info --path "$RUNNER_TEMP/master.db" --plain --format json
