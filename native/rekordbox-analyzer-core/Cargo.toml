[package]
name = "rekordbox-analyzer-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Clean-room Rekordbox DAT, EXT, and 2EX primitives and differential tooling"
homepage = "https://github.com/gakonst/music-ts"
readme = "ANLZ_COMPATIBILITY.md"
repository = "https://github.com/gakonst/music-ts"
include = ["Cargo.toml", "Cargo.lock", "src/**", "ANLZ_COMPATIBILITY.md"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
