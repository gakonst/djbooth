[project]
name = "rekordbox-stems-mlx"
version = "0.1.0"
description = "MLX Mel-Band-RoFormer adapter for @gakonst/rekordbox"
requires-python = ">=3.12,<3.13"
dependencies = ["huggingface-hub[hf-xet]==1.25.1", "mlx-audio-separator[convert]==0.1.5"]

[dependency-groups]
dev = ["ruff==0.12.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
