[package]
name = "rekordbox-library-gpui"
version = "0.1.0"
description = "GPUI-native Rekordbox library workstation prototype"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.1", features = ["json"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
