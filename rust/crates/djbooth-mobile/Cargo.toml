[package]
name = "djbooth-mobile"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
djtools-link.workspace = true
djbooth-analyzer.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8.0"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
serde_json.workspace = true
