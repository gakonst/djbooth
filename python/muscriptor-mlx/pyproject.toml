[project]
name = "djbooth-muscriptor-mlx"
version = "0.1.0"
description = "MLX-native MuScriptor audio-to-MIDI transcription"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub[hf-xet]==1.25.1",
  "mido==1.3.3",
  "mlx==0.31.2",
  "numpy==2.4.2",
  "scipy==1.17.0",
  "soundfile==0.13.1",
]

[project.scripts]
djbooth-muscriptor-mlx = "djbooth_muscriptor_mlx:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["djbooth_muscriptor_mlx"]

[dependency-groups]
dev = ["ruff==0.12.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
